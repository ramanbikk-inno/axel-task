name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, build, migrate, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axel
          POSTGRES_PASSWORD: axel
          POSTGRES_DB: axel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axel -d axel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: axel
      DB_PASSWORD: axel
      DB_NAME: axel_test
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-32
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-32
      SUPER_ADMIN_EMAIL: admin@example.com
      SUPER_ADMIN_PASSWORD: 'Str0ng!Passw0rd'
      RESEND_API_KEY: re_ci_dummy_key
      MAIL_FROM: 'noreply@example.com'
      CLOUDINARY_URL: 'cloudinary://key:secret@cloud'
      CORS_ORIGINS: 'http://localhost:3000'
      APP_URL: 'http://localhost:3000'
      PORT: '3000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migration:run

      - name: Unit and integration tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e
